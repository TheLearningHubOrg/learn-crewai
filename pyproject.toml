[project]
name = "learn-crewai"
version = "1.0.0"
description = "Starter project for the learn-crewai guide: a two-agent CrewAI crew behind a FastAPI service."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
